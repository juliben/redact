<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Redact</title>
<style>
  :root { --bg: #f4f4f5; --panel: #fff; --text: #18181b; --muted: #71717a; --border: #e4e4e7; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --panel: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --border: #3f3f46; --accent: #3b82f6; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column;
         touch-action: manipulation; -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  h1 { font-size: 16px; margin: 0; }
  button, .btn { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
                 background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--muted); }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 48px 24px; text-align: center; max-width: 480px; cursor: pointer; }
  #drop:hover, #drop.over { border-color: var(--accent); }
  canvas { display: none; max-width: 100%; max-height: calc(100vh - 100px); cursor: none; touch-action: none;
           box-shadow: 0 2px 12px rgba(0,0,0,.25); }
</style>
</head>
<body>
<header>
  <h1>Redact</h1>
  <label class="btn">Open…<input id="file" type="file" accept="image/*" hidden></label>
  <label class="muted">Size <input id="size" type="range" min="4" max="200" value="24"></label>
  <span id="sizeLabel" class="muted">24px</span>
  <label><input id="freehand" type="checkbox"> Freehand</label>
  <button id="undo" disabled>Undo</button>
  <button id="redo" disabled>Redo</button>
  <button id="clear" disabled>Clear</button>
  <button id="save" disabled>Save</button>
  <button id="folder" disabled>Save to…</button>
  <span id="folderLabel" class="muted"></span>
</header>
<main>
  <label id="drop" for="file">Drop or upload an image…</label>
  <canvas id="canvas"></canvas>
</main>
<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const base = document.createElement('canvas'), baseCtx = base.getContext('2d');
const orig = document.createElement('canvas'), origCtx = orig.getContext('2d', { willReadFrequently: true });

const touch = matchMedia('(pointer: coarse)').matches;
let fileName = 'image', folder = null, ops = [], undone = [], stroke = null, hover = null;

async function load(file) {
  if (!file?.type.startsWith('image/')) return;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { return alert('This image format is not supported by your browser.'); }
  const scale = Math.min(1, Math.sqrt(16e6 / (bmp.width * bmp.height)));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  for (const c of [canvas, base, orig]) { c.width = w; c.height = h; }
  origCtx.drawImage(bmp, 0, 0, w, h);
  fileName = file.name.replace(/\.[^.]+$/, '') || 'image';
  ops = []; undone = [];
  $('size').max = Math.max(64, Math.round(h / 5));
  $('drop').style.display = 'none';
  canvas.style.display = 'block';
  $('save').disabled = $('folder').disabled = false;
  rebuild();
  if (touch) {
    const finger = Math.round(44 * w / canvas.getBoundingClientRect().width);
    $('size').max = Math.max($('size').max, finger * 3);
    setSize(finger);
  }
}

function brushSize() { return +$('size').value; }
function blockSize() { return Math.max(8, Math.round(Math.max(canvas.width, canvas.height) / 60)); }

function bounds(rects) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of rects) {
    x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y);
    x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h);
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function palette(rects) {
  const bb = bounds(rects);
  const data = origCtx.getImageData(bb.x, bb.y, bb.w, bb.h).data;
  const step = Math.max(1, Math.floor(Math.sqrt(bb.w * bb.h / 8000)));
  const buckets = new Map();
  let total = 0;
  for (let y = 0; y < bb.h; y += step) {
    for (let x = 0; x < bb.w; x += step) {
      const i = (y * bb.w + x) * 4, ax = bb.x + x, ay = bb.y + y;
      if (!data[i + 3] || !rects.some(r => ax >= r.x && ax < r.x + r.w && ay >= r.y && ay < r.y + r.h)) continue;
      const key = (data[i] >> 4) << 8 | (data[i + 1] >> 4) << 4 | data[i + 2] >> 4;
      const bk = buckets.get(key) ?? { n: 0, sum: [0, 0, 0] };
      bk.n++;
      for (let k = 0; k < 3; k++) bk.sum[k] += data[i + k];
      buckets.set(key, bk);
      total++;
    }
  }
  if (!total) return { bg: [128, 128, 128], fg: [128, 128, 128] };
  const list = [...buckets.values()].map(bk => ({ n: bk.n, color: bk.sum.map(s => s / bk.n) }));
  const bg = list.reduce((a, c) => c.n > a.n ? c : a).color;
  const dist = c => Math.hypot(c[0] - bg[0], c[1] - bg[1], c[2] - bg[2]);
  const fg = list.filter(c => c.n >= total * 0.02).reduce((a, c) => dist(c.color) > dist(a) ? c.color : a, bg);
  return { bg, fg };
}

function paint(c, op) {
  op.palette ??= palette(op.rects);
  const { bg, fg } = op.palette, bb = bounds(op.rects), b = blockSize();
  c.save();
  c.beginPath();
  for (const r of op.rects) c.rect(r.x, r.y, r.w, r.h);
  c.clip();
  for (let cy = Math.floor(bb.y / b); cy * b < bb.y + bb.h; cy++) {
    for (let cx = Math.floor(bb.x / b); cx * b < bb.x + bb.w; cx++) {
      const key = cx + ',' + cy;
      if (!op.cells.has(key)) op.cells.set(key, [Math.random() ** 2 * 0.6, (Math.random() - 0.5) * 14]);
      const [t, n] = op.cells.get(key);
      c.fillStyle = `rgb(${bg.map((v, i) => Math.round(v + (fg[i] - v) * t + n))})`;
      c.fillRect(cx * b, cy * b, b, b);
    }
  }
  c.restore();
}

function rebuild() {
  baseCtx.drawImage(orig, 0, 0);
  ops.forEach(op => paint(baseCtx, op));
  $('undo').disabled = $('clear').disabled = !ops.length;
  $('redo').disabled = !undone.length;
  render();
}

function render() {
  ctx.drawImage(base, 0, 0);
  if (stroke) paint(ctx, stroke);
  if (hover) {
    const size = brushSize(), px = canvas.width / canvas.getBoundingClientRect().width;
    ctx.save();
    ctx.globalCompositeOperation = 'difference';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = px;
    ctx.strokeRect(Math.round(hover.x - size / 2) + px / 2, Math.round(hover.y - size / 2) + px / 2, size - px, size - px);
    ctx.restore();
  }
}

function point(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.min(canvas.width, Math.max(0, (e.clientX - r.left) * canvas.width / r.width)),
    y: Math.min(canvas.height, Math.max(0, (e.clientY - r.top) * canvas.height / r.height)),
  };
}

function extend(p) {
  const { size, start, last } = stroke;
  stroke.palette = null;
  if (!$('freehand').checked) {
    const x0 = Math.round(Math.min(start.x, p.x) - size / 2), x1 = Math.round(Math.max(start.x, p.x) + size / 2);
    stroke.rects = [{ x: x0, y: Math.round(start.y - size / 2), w: x1 - x0, h: size }];
    return;
  }
  const steps = Math.max(1, Math.ceil(Math.hypot(p.x - last.x, p.y - last.y) / (size / 4)));
  for (let i = 1; i <= steps; i++) {
    const x = last.x + (p.x - last.x) * i / steps, y = last.y + (p.y - last.y) * i / steps;
    const r = { x: Math.round(x - size / 2), y: Math.round(y - size / 2), w: size, h: size }, prev = stroke.rects[stroke.rects.length - 1];
    if (!prev || prev.x !== r.x || prev.y !== r.y) stroke.rects.push(r);
  }
  stroke.last = p;
}

canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  canvas.setPointerCapture(e.pointerId);
  const p = point(e);
  stroke = { size: brushSize(), start: p, last: p, rects: [], cells: new Map() };
  extend(p);
  render();
});
canvas.addEventListener('pointermove', e => {
  hover = point(e);
  if (stroke) extend(hover);
  render();
});
function finish() {
  if (!stroke) return;
  ops.push(stroke);
  undone = [];
  stroke = null;
  rebuild();
}
canvas.addEventListener('pointerup', finish);
canvas.addEventListener('pointercancel', finish);
canvas.addEventListener('pointerleave', () => { hover = null; render(); });

function undo() { if (ops.length) { undone.push(ops.pop()); rebuild(); } }
function redo() { if (undone.length) { ops.push(undone.pop()); rebuild(); } }
async function saveTo() {
  try { folder = await showDirectoryPicker({ mode: 'readwrite' }); } catch { return; }
  save();
}
function save() {
  if ($('save').disabled) return;
  const name = `${fileName}-redacted.png`;
  base.toBlob(async blob => {
    if (folder) {
      const writable = await (await folder.getFileHandle(name, { create: true })).createWritable();
      await writable.write(blob);
      await writable.close();
      $('folderLabel').textContent = `Saved to ${folder.name}/${name}`;
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, 'image/png');
}
function setSize(v) { $('size').value = v; $('sizeLabel').textContent = brushSize() + 'px'; render(); }

$('undo').onclick = undo;
$('redo').onclick = redo;
$('clear').onclick = () => { if (confirm('Remove all redactions?')) { ops = []; undone = []; rebuild(); } };
$('save').onclick = save;
$('folder').onclick = saveTo;
$('folder').hidden = $('folderLabel').hidden = !window.showDirectoryPicker;
if (touch) $('drop').textContent = 'Upload an image…';
$('size').oninput = e => setSize(e.target.value);
$('file').onchange = e => { load(e.target.files[0]); e.target.value = ''; };

document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) load(new File([item.getAsFile()], 'pasted.png', { type: item.type }));
});
document.addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
document.addEventListener('dragleave', () => $('drop').classList.remove('over'));
document.addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); load(e.dataTransfer.files[0]); });

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y') { e.preventDefault(); redo(); }
  else if (mod && k === 's') { e.preventDefault(); save(); }
  else if (!mod && k === 'f') $('freehand').checked = !$('freehand').checked;
  else if (!mod && (k === '[' || k === ']')) setSize(brushSize() + (k === ']' ? 2 : -2));
});
</script>
</body>
</html>
