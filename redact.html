<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Redact</title>
<style>
  :root { --bg: #f4f4f5; --panel: #fff; --text: #18181b; --muted: #71717a; --border: #e4e4e7; --accent: #2563eb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #18181b; --panel: #27272a; --text: #f4f4f5; --muted: #a1a1aa; --border: #3f3f46; --accent: #3b82f6; }
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, sans-serif;
         min-height: 100vh; display: flex; flex-direction: column;
         touch-action: manipulation; -webkit-user-select: none; user-select: none;
         -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 10px 16px;
           background: var(--panel); border-bottom: 1px solid var(--border); }
  h1 { font-size: 16px; margin: 0; }
  button, .btn { font: inherit; padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px;
                 background: var(--panel); color: var(--text); cursor: pointer; }
  button:hover:not(:disabled), .btn:hover { border-color: var(--accent); }
  button:disabled { opacity: .45; cursor: default; }
  .muted { color: var(--muted); }
  .size { display: flex; align-items: center; gap: 8px; }
  #sizeLabel { width: 4.5ch; font-variant-numeric: tabular-nums; }
  .actions { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  main { flex: 1; display: flex; align-items: center; justify-content: center; padding: 16px; overflow: hidden; }
  #drop { border: 2px dashed var(--border); border-radius: 12px; padding: 48px 24px; text-align: center; max-width: 480px; cursor: pointer; }
  #drop:hover, #drop.over { border-color: var(--accent); }
  canvas { display: none; transform-origin: 0 0; max-width: 100%; max-height: calc(100vh - 100px); cursor: none; touch-action: none;
           box-shadow: 0 2px 12px rgba(0,0,0,.25); }
  #sheet { position: fixed; inset: 0; z-index: 2; display: flex; flex-direction: column; align-items: center;
           justify-content: center; gap: 12px; padding: 16px; background: rgba(0,0,0,.9); color: #fff; text-align: center; }
  #sheet[hidden] { display: none; }
  #sheet img { max-width: 100%; max-height: 70vh; -webkit-touch-callout: default; -webkit-user-select: auto; user-select: auto; }
  #sheet div { display: flex; gap: 8px; }
  #sheet button { padding: 10px 20px; }
  @media (max-width: 640px) {
    .size { order: 1; flex: 1 1 100%; }
    .size input { flex: 1; }
    .actions { position: fixed; left: 0; right: 0; bottom: 0; flex-wrap: nowrap; gap: 8px; z-index: 1;
               padding: 10px 16px calc(10px + env(safe-area-inset-bottom)); background: var(--panel); border-top: 1px solid var(--border); }
    .actions button { flex: 1; padding: 10px 0; }
    .actions #folderLabel { display: none; }
    main { padding-bottom: 80px; }
    canvas { max-height: calc(100vh - 220px); max-height: calc(100dvh - 220px); }
  }
</style>
</head>
<body>
<header>
  <h1>Redact</h1>
  <label class="btn">Open…<input id="file" type="file" accept="image/*" hidden></label>
  <label class="size muted">Size <input id="size" type="range" min="4" max="200" value="24"> <span id="sizeLabel">24px</span></label>
  <label><input id="freehand" type="checkbox"> Freehand</label>
  <div class="actions">
    <button id="undo" disabled>Undo</button>
    <button id="redo" disabled>Redo</button>
    <button id="clear" disabled>Clear</button>
    <button id="save" disabled>Save</button>
    <button id="folder" disabled>Save to…</button>
    <span id="folderLabel" class="muted"></span>
  </div>
</header>
<main>
  <label id="drop" for="file">Drop or upload an image…</label>
  <canvas id="canvas"></canvas>
</main>
<div id="sheet" hidden>
  <img id="result" alt="Redacted image">
  <p>Press and hold the image to save it to your gallery.</p>
  <div>
    <button id="share" hidden>Share…</button>
    <button id="done">Done</button>
  </div>
</div>
<script>
const $ = id => document.getElementById(id);
const canvas = $('canvas'), ctx = canvas.getContext('2d');
const base = document.createElement('canvas'), baseCtx = base.getContext('2d');
const orig = document.createElement('canvas'), origCtx = orig.getContext('2d', { willReadFrequently: true });

const touch = matchMedia('(pointer: coarse)').matches;
const pointers = new Map();
let view = { s: 1, x: 0, y: 0 }, pinch = null;
let pixels = null, fileName = 'image', folder = null, ops = [], undone = [], stroke = null, hover = null;

async function load(file) {
  if (!file?.type.startsWith('image/')) return;
  let bmp;
  try { bmp = await createImageBitmap(file); } catch { return alert('This image format is not supported by your browser.'); }
  const scale = Math.min(1, Math.sqrt(16e6 / (bmp.width * bmp.height)));
  const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);
  for (const c of [canvas, base, orig]) { c.width = w; c.height = h; }
  origCtx.drawImage(bmp, 0, 0, w, h);
  pixels = origCtx.getImageData(0, 0, w, h).data;
  fileName = file.name.replace(/\.[^.]+$/, '') || 'image';
  ops = []; undone = [];
  $('size').max = Math.max(64, Math.round(h / 5));
  $('drop').style.display = 'none';
  canvas.style.display = 'block';
  setView({ s: 1, x: 0, y: 0 });
  $('save').disabled = $('folder').disabled = false;
  rebuild();
  if (touch) {
    $('size').max = Math.max($('size').max, 255);
    setSize(85);
  }
}

function brushSize() { return +$('size').value; }
function blockSize() { return Math.max(8, Math.round(Math.max(canvas.width, canvas.height) / 60)); }

function bounds(rects) {
  let x0 = Infinity, y0 = Infinity, x1 = -Infinity, y1 = -Infinity;
  for (const r of rects) {
    x0 = Math.min(x0, r.x); y0 = Math.min(y0, r.y);
    x1 = Math.max(x1, r.x + r.w); y1 = Math.max(y1, r.y + r.h);
  }
  return { x: x0, y: y0, w: x1 - x0, h: y1 - y0 };
}

function colors(x0, y0, w, h, inside = () => true) {
  x0 = Math.max(0, Math.floor(x0)); y0 = Math.max(0, Math.floor(y0));
  const x1 = Math.min(orig.width, x0 + w), y1 = Math.min(orig.height, y0 + h);
  const step = Math.max(1, Math.floor(Math.sqrt((x1 - x0) * (y1 - y0) / 8000)));
  const buckets = new Map();
  let total = 0;
  for (let y = y0; y < y1; y += step) {
    for (let x = x0; x < x1; x += step) {
      const i = (y * orig.width + x) * 4;
      if (!pixels[i + 3] || !inside(x, y)) continue;
      const key = (pixels[i] >> 4) << 8 | (pixels[i + 1] >> 4) << 4 | pixels[i + 2] >> 4;
      const bk = buckets.get(key) ?? { n: 0, sum: [0, 0, 0] };
      bk.n++;
      for (let k = 0; k < 3; k++) bk.sum[k] += pixels[i + k];
      buckets.set(key, bk);
      total++;
    }
  }
  if (!total) return { bg: [128, 128, 128], fg: [128, 128, 128] };
  const list = [...buckets.values()].map(bk => ({ n: bk.n, color: bk.sum.map(s => s / bk.n) }));
  const bg = list.reduce((a, c) => c.n > a.n ? c : a).color;
  const fg = list.filter(c => c.n >= total * 0.02).reduce((a, c) => dist(c.color, bg) > dist(a, bg) ? c.color : a, bg);
  return { bg, fg };
}

function dist(a, b) { return Math.hypot(a[0] - b[0], a[1] - b[1], a[2] - b[2]); }

function cellColor(op, cx, cy, b) {
  const bg = colors((cx - 1) * b, (cy - 1) * b, 3 * b, 3 * b).bg;
  const light = bg[0] * 0.3 + bg[1] * 0.59 + bg[2] * 0.11 > 128;
  const fg = dist(op.ink, bg) > 48 ? op.ink : bg.map(v => light ? v * 0.55 : v + (255 - v) * 0.45);
  const t = Math.random() ** 2 * 0.6, n = (Math.random() - 0.5) * 14;
  return `rgb(${bg.map((v, i) => Math.round(v + (fg[i] - v) * t + n))})`;
}

function paint(c, op) {
  const bb = bounds(op.rects), b = blockSize();
  op.ink ??= colors(bb.x, bb.y, bb.w, bb.h, (x, y) => op.rects.some(r => x >= r.x && x < r.x + r.w && y >= r.y && y < r.y + r.h)).fg;
  c.save();
  c.beginPath();
  for (const r of op.rects) c.rect(r.x, r.y, r.w, r.h);
  c.clip();
  for (let cy = Math.floor(bb.y / b); cy * b < bb.y + bb.h; cy++) {
    for (let cx = Math.floor(bb.x / b); cx * b < bb.x + bb.w; cx++) {
      const key = cx + ',' + cy;
      if (!op.cells.has(key)) op.cells.set(key, cellColor(op, cx, cy, b));
      c.fillStyle = op.cells.get(key);
      c.fillRect(cx * b, cy * b, b, b);
    }
  }
  c.restore();
}

function rebuild() {
  baseCtx.drawImage(orig, 0, 0);
  ops.forEach(op => paint(baseCtx, op));
  $('undo').disabled = $('clear').disabled = !ops.length;
  $('redo').disabled = !undone.length;
  render();
}

function render() {
  ctx.drawImage(base, 0, 0);
  if (stroke) paint(ctx, stroke);
  if (hover) {
    const size = brushSize(), px = canvas.width / canvas.getBoundingClientRect().width;
    ctx.save();
    ctx.globalCompositeOperation = 'difference';
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = px;
    ctx.strokeRect(Math.round(hover.x - size / 2) + px / 2, Math.round(hover.y - size / 2) + px / 2, size - px, size - px);
    ctx.restore();
  }
}

function point(e) {
  const r = canvas.getBoundingClientRect();
  return {
    x: Math.min(canvas.width, Math.max(0, (e.clientX - r.left) * canvas.width / r.width)),
    y: Math.min(canvas.height, Math.max(0, (e.clientY - r.top) * canvas.height / r.height)),
  };
}

function extend(p) {
  const { size, start, last } = stroke;
  stroke.ink = null;
  if (!$('freehand').checked) {
    const x0 = Math.round(Math.min(start.x, p.x) - size / 2), x1 = Math.round(Math.max(start.x, p.x) + size / 2);
    stroke.rects = [{ x: x0, y: Math.round(start.y - size / 2), w: x1 - x0, h: size }];
    return;
  }
  const steps = Math.max(1, Math.ceil(Math.hypot(p.x - last.x, p.y - last.y) / (size / 4)));
  for (let i = 1; i <= steps; i++) {
    const x = last.x + (p.x - last.x) * i / steps, y = last.y + (p.y - last.y) * i / steps;
    const r = { x: Math.round(x - size / 2), y: Math.round(y - size / 2), w: size, h: size }, prev = stroke.rects[stroke.rects.length - 1];
    if (!prev || prev.x !== r.x || prev.y !== r.y) stroke.rects.push(r);
  }
  stroke.last = p;
}

canvas.addEventListener('touchstart', e => e.preventDefault(), { passive: false });
canvas.addEventListener('touchmove', e => e.preventDefault(), { passive: false });
function setView(v) {
  view = v;
  canvas.style.transform = `translate(${v.x}px, ${v.y}px) scale(${v.s})`;
}

function startPinch() {
  const [a, b] = [...pointers.values()], r = canvas.getBoundingClientRect();
  pinch = { d: Math.hypot(a.x - b.x, a.y - b.y), m: { x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 },
            view, left: r.left - view.x, top: r.top - view.y };
}

function movePinch() {
  const [a, b] = [...pointers.values()], { d, m, view: v, left, top } = pinch;
  const s = Math.min(8, Math.max(1, v.s * Math.hypot(a.x - b.x, a.y - b.y) / d));
  if (s === 1) return setView({ s: 1, x: 0, y: 0 });
  const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
  setView({ s, x: mx - left - s * (m.x - left - v.x) / v.s, y: my - top - s * (m.y - top - v.y) / v.s });
}

canvas.addEventListener('pointerdown', e => {
  e.preventDefault();
  try { canvas.setPointerCapture(e.pointerId); } catch {}
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pointers.size === 2) { stroke = hover = null; startPinch(); render(); }
  if (pointers.size > 1) return;
  const p = point(e);
  stroke = { size: brushSize(), start: p, last: p, rects: [], cells: new Map() };
  extend(p);
  render();
});
canvas.addEventListener('pointermove', e => {
  if (pointers.has(e.pointerId)) pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (pinch) return movePinch();
  if (e.pointerType !== 'touch' || stroke) hover = point(e);
  if (stroke) extend(hover);
  render();
});
function finish(e) {
  pointers.delete(e.pointerId);
  if (pinch) { if (pointers.size < 2) pinch = null; return; }
  if (e.pointerType === 'touch') hover = null;
  if (!stroke) return render();
  ops.push(stroke);
  undone = [];
  stroke = null;
  rebuild();
}
canvas.addEventListener('pointerup', finish);
canvas.addEventListener('pointercancel', finish);
canvas.addEventListener('pointerleave', () => { hover = null; render(); });

function undo() { if (ops.length) { undone.push(ops.pop()); rebuild(); } }
function redo() { if (undone.length) { ops.push(undone.pop()); rebuild(); } }
async function saveTo() {
  try { folder = await showDirectoryPicker({ mode: 'readwrite' }); } catch { return; }
  save();
}
function showSheet(name) {
  const url = base.toDataURL('image/png');
  const bytes = Uint8Array.from(atob(url.split(',')[1]), c => c.charCodeAt(0));
  const file = new File([bytes], name, { type: 'image/png' });
  $('result').src = url;
  $('share').hidden = !navigator.canShare?.({ files: [file] });
  $('share').onclick = () => navigator.share({ files: [file] }).catch(() => {});
  $('sheet').hidden = false;
}
function save() {
  if ($('save').disabled) return;
  const name = `${fileName}-redacted.png`;
  if (touch) return showSheet(name);
  base.toBlob(async blob => {
    if (folder) {
      const writable = await (await folder.getFileHandle(name, { create: true })).createWritable();
      await writable.write(blob);
      await writable.close();
      $('folderLabel').textContent = `Saved to ${folder.name}/${name}`;
      return;
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.append(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
  }, 'image/png');
}
function setSize(v) { $('size').value = v; $('sizeLabel').textContent = brushSize() + 'px'; render(); }

$('done').onclick = () => { $('sheet').hidden = true; $('result').removeAttribute('src'); };
$('undo').onclick = undo;
$('redo').onclick = redo;
$('clear').onclick = () => { if (confirm('Remove all redactions?')) { ops = []; undone = []; rebuild(); } };
$('save').onclick = save;
$('folder').onclick = saveTo;
$('folder').hidden = $('folderLabel').hidden = !window.showDirectoryPicker;
if (touch) $('drop').textContent = 'Upload an image…';
$('size').oninput = e => setSize(e.target.value);
$('file').onchange = e => { load(e.target.files[0]); e.target.value = ''; };

document.addEventListener('paste', e => {
  const item = [...e.clipboardData.items].find(i => i.type.startsWith('image/'));
  if (item) load(new File([item.getAsFile()], 'pasted.png', { type: item.type }));
});
document.addEventListener('dragover', e => { e.preventDefault(); $('drop').classList.add('over'); });
document.addEventListener('dragleave', () => $('drop').classList.remove('over'));
document.addEventListener('drop', e => { e.preventDefault(); $('drop').classList.remove('over'); load(e.dataTransfer.files[0]); });

document.addEventListener('keydown', e => {
  const mod = e.ctrlKey || e.metaKey, k = e.key.toLowerCase();
  if (mod && k === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
  else if (mod && k === 'y') { e.preventDefault(); redo(); }
  else if (mod && k === 's') { e.preventDefault(); save(); }
  else if (!mod && k === 'f') $('freehand').checked = !$('freehand').checked;
  else if (!mod && (k === '[' || k === ']')) setSize(brushSize() + (k === ']' ? 2 : -2));
});
</script>
</body>
</html>
